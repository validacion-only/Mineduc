<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado Validado</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #525659; /* Fondo oscuro típico de los visores PDF */
        }
        
        /* El contenedor que carga tu PDF de fondo */
        .pdf-container {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* La capa del sello de agua que se pone por encima */
        .sello-agua {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* CRUCIAL: Permite hacer scroll en el PDF que está debajo */
            z-index: 9999;
            /* SVG que genera el texto en diagonal repetido como en la imagen */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='800' height='800'%3E%3Ctext x='50%25' y='50%25' transform='rotate(-45 400 400)' fill='rgba(180,180,180,0.35)' font-size='48' font-family='Arial, sans-serif' font-weight='bold' text-anchor='middle'%3ECOPIA NO VALIDA COMO CERTIFICADO%3C/text%3E%3C/svg%3E");
            background-repeat: repeat;
        }
    </style>
</head>
<body>
    <!-- Capa transparente con el texto diagonal -->
    <div class="sello-agua"></div>
    
    <!-- Tu archivo PDF real que debe estar en la misma carpeta -->
    <iframe class="pdf-container" src="MaicolM.pdf"></iframe>
</body>
</html>
